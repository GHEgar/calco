name: CI

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  geoserver:
    runs-on: ubuntu-latest
    services:
      geoserver:
        image: kartoza/geoserver:3.0.0
        env:
          SAMPLE_DATA: 'true'
          GEOSERVER_ADMIN_USER: admin
          GEOSERVER_ADMIN_PASSWORD: geoserver
        ports:
          - 8599:8080
    env:
      CALCO_GEOSERVER_URL: http://localhost:8599/geoserver
      CALCO_GEOSERVER_AUTH: admin:geoserver
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - name: Wait for GeoServer
        run: |
          for attempt in $(seq 1 120); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -u "$CALCO_GEOSERVER_AUTH" \
              "$CALCO_GEOSERVER_URL/rest/about/version.json" || true)
            [ "$code" = 200 ] && exit 0
            sleep 5
          done
          echo "GeoServer did not answer in 10 minutes"
          exit 1
      - run: pytest -m geoserver
